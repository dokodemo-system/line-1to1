<!doctype html>
<!--
  LINE 1to1 の LIFF 画面（単一ページ）。?view=register|book|change|admin|pending で画面を切り替えます。
  判断したこと: config.js → LIFF SDK → app.js の順に読み込み、画面の中身はすべて app.js が描きます。
-->
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <title>読み込み中です</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <h1 id="title">読み込み中です</h1>
  </header>

  <main id="app" aria-live="polite">
    <div class="loading" role="status">
      <div class="spinner" aria-hidden="true"></div>
      <p>読み込み中です…</p>
    </div>
  </main>

  <noscript>
    <p class="noscript">この画面を表示するには JavaScript を有効にしてください。</p>
  </noscript>

  <script src="config.js"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="app.js"></script>
</body>
</html>
